<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 54" width="720" height="54" fill="none">
  <!-- Container background -->
  <rect width="720" height="54" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Hotmart badge text -->
  <g transform="translate(18, 14)">
    <circle cx="13" cy="13" r="13" fill="#F04E23"/>
    <path d="M12.8 5.5c-.3 0-.6.1-.8.3-2.1 2.3-4.5 5.8-3.4 9.4 1 3.4 4.1 5.3 7.3 4.2 3.1-1.1 4.8-4.4 3.9-7.6-.7-2.7-2.6-4.5-4.5-5.9-.6-.4-1.5-.7-2.5-.4z" fill="#FFF"/>
    <text x="32" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.5">PAGO SEGURO VÍA HOTMART</text>
  </g>

  <line x1="228" y1="12" x2="228" y2="42" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Payment Icons Group -->
  <!-- VISA -->
  <g transform="translate(244, 12)">
    <rect width="52" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="26" y="21" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" font-style="italic" fill="#1A1F71" text-anchor="middle">VISA</text>
  </g>

  <!-- MASTERCARD -->
  <g transform="translate(306, 12)">
    <rect width="52" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="21" cy="15" r="9" fill="#EB001B"/>
    <circle cx="31" cy="15" r="9" fill="#F79E1B" fill-opacity="0.88"/>
  </g>

  <!-- AMEX -->
  <g transform="translate(368, 12)">
    <rect width="52" height="30" rx="6" fill="#016FD0" stroke="#005AA8" stroke-width="1"/>
    <text x="26" y="20" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">AMEX</text>
  </g>

  <!-- PAYPAL -->
  <g transform="translate(430, 12)">
    <rect width="52" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="26" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="900" font-style="italic" fill="#003087" text-anchor="middle">Pay<tspan fill="#0079C1">Pal</tspan></text>
  </g>

  <!-- PIX -->
  <g transform="translate(492, 12)">
    <rect width="52" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M26 8 L33 15 L26 22 L19 15 Z" fill="#32BCAD"/>
    <text x="26" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">PIX</text>
  </g>

  <!-- OXXO / EFECTIVO -->
  <g transform="translate(554, 12)">
    <rect width="52" height="30" rx="6" fill="#D32F2F" stroke="#B71C1C" stroke-width="1"/>
    <text x="26" y="20" font-family="Arial Black, Impact, sans-serif" font-size="11" font-weight="900" fill="#FFEB3B" text-anchor="middle" letter-spacing="0.5">OXXO</text>
  </g>

  <!-- SSL LOCK -->
  <g transform="translate(616, 12)">
    <rect width="90" height="30" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Lock icon -->
    <path d="M628 17 v-2 a4 4 0 0 1 8 0 v2 h1 a1 1 0 0 1 1 1 v6 a1 1 0 0 1-1 1 h-10 a1 1 0 0 1-1-1 v-6 a1 1 0 0 1 1-1 h1 z m2 0 h4 v-2 a2 2 0 0 0-4 0 v2 z" fill="#16A34A" transform="translate(-610, -2)"/>
    <text x="36" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#15803D">SSL 256-BIT</text>
  </g>
</svg>
